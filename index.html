<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiteDash | Ordering Portal</title>
  <style>
    :root {
      --primary: #ff4757;
      --primary-hover: #ff6b81;
      --secondary: #2ed573;
      --dark: #2f3542;
      --light-bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2f3542;
      --subtext: #747d8c;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--light-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hidden {
      display: none !important;
    }

    /* Common App Wrapper */
    .app-screen {
      width: 100%;
      max-width: 440px;
      min-height: 90vh;
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .admin-screen {
      max-width: 900px;
    }

    /* Toast Notifications */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #ff4757;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* --- 1. LOGIN SCREEN --- */
    .login-container {
      padding: 40px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      flex-grow: 1;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
    }

    .brand-subtitle {
      font-size: 14px;
      color: var(--subtext);
      margin-top: 4px;
    }

    .role-toggle {
      display: flex;
      background: #f1f2f6;
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .role-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--subtext);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .role-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      outline: none;
      font-size: 15px;
      background: #fafafa;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    /* --- 2. USER STOREFRONT --- */
    header {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .user-info-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background: #ffeaa7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .cart-btn {
      position: relative;
      background: #f1f2f6;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cart-badge {
      background: var(--primary);
      color: white;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 20px;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      color: var(--subtext);
    }

    .content-area {
      padding: 20px;
      flex-grow: 1;
      overflow-y: auto;
    }

    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 16px;
    }

    .menu-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #fff;
    }

    .menu-info h4 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .menu-info p {
      font-size: 13px;
      color: var(--subtext);
      margin-bottom: 8px;
    }

    .menu-price {
      font-weight: 700;
      color: var(--primary);
    }

    .add-to-cart {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Cart Drawer Modal */
    .cart-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .cart-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .cart-content {
      background: white;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close-cart {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    .cart-items {
      overflow-y: auto;
      max-height: 250px;
      margin-bottom: 16px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .checkout-btn {
      background: var(--secondary);
      color: white;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    /* --- 3. ADMIN DASHBOARD --- */
    .admin-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 28px;
      background: #1e293b;
      color: white;
    }

    .admin-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 24px;
    }

    @media (max-width: 768px) {
      .admin-layout {
        grid-template-columns: 1fr;
      }
    }

    .admin-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .admin-card h3 {
      margin-bottom: 16px;
      font-size: 18px;
    }

    .order-list-admin {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .order-item-admin {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .status-pending { background: #ffeaa7; color: #d63031; }
    .status-completed { background: #c8d6e5; color: #222f3e; }
  </style>
</head>
<body>

  <div id="toast" class="toast">Invalid Credentials</div>

  <!-- 1. LOGIN SCREEN -->
  <div id="screen-login" class="app-screen">
    <div class="login-container">
      <div class="brand-header">
        <div class="brand-logo">🍔</div>
        <div class="brand-title">BiteDash</div>
        <div class="brand-subtitle">Sign in to access your portal</div>
      </div>

      <div class="role-toggle">
        <button id="toggle-user" class="role-btn active" onclick="setRole('user')">User Login</button>
        <button id="toggle-admin" class="role-btn" onclick="setRole('admin')">Admin Login</button>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Enter username" required />
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter password" required />
        </div>

        <button type="submit" class="submit-btn">Login to Platform</button>
      </form>
    </div>
  </div>

  <!-- 2. USER STOREFRONT SCREEN -->
  <div id="screen-user" class="app-screen hidden">
    <header>
      <div class="user-info-bar">
        <div class="avatar">👤</div>
        <div>
          <div style="font-weight: 700; font-size: 14px;" id="user-display-name">Customer</div>
          <div style="font-size: 11px; color: var(--subtext);">Ordering Mobile</div>
        </div>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="cart-btn" onclick="toggleCart(true)">
          🛒 <span id="cart-count" class="cart-badge">0</span>
        </button>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </header>

    <div class="content-area">
      <h3 style="margin-bottom: 12px;">Menu Options</h3>
      <div id="menu-container" class="menu-grid"></div>
    </div>

    <!-- Cart Drawer Modal -->
    <div id="cart-modal" class="cart-modal">
      <div class="cart-content">
        <div class="cart-header">
          <h3>Your Order</h3>
          <button class="close-cart" onclick="toggleCart(false)">✕</button>
        </div>
        <div id="cart-items" class="cart-items"></div>
        <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 18px; margin-bottom: 16px;">
          <span>Total:</span>
          <span id="cart-total">$0.00</span>
        </div>
        <button class="checkout-btn" onclick="placeOrder()">Place Order</button>
      </div>
    </div>
  </div>

  <!-- 3. ADMIN DASHBOARD SCREEN -->
  <div id="screen-admin" class="app-screen admin-screen hidden">
    <div class="admin-nav">
      <h2>⚙️ Admin Control Center</h2>
      <button class="logout-btn" style="color: white; border-color: #475569;" onclick="logout()">Logout</button>
    </div>

    <div class="admin-layout">
      <!-- Left: Add Item Form -->
      <div class="admin-card">
        <h3>Add Menu Item</h3>
        <form onsubmit="addMenuItem(event)">
          <div class="form-group">
            <label class="form-label">Item Title</label>
            <input type="text" id="item-title" class="form-input" required placeholder="e.g. Bacon Burger" />
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <input type="text" id="item-desc" class="form-input" required placeholder="Short item description" />
          </div>
          <div class="form-group">
            <label class="form-label">Price ($)</label>
            <input type="number" step="0.01" id="item-price" class="form-input" required placeholder="12.99" />
          </div>
          <button type="submit" class="submit-btn" style="background: var(--dark);">Add to Live Menu</button>
        </form>
      </div>

      <!-- Right: Live Orders -->
      <div class="admin-card">
        <h3>Incoming Orders</h3>
        <div id="admin-orders-list" class="order-list-admin"></div>
      </div>
    </div>
  </div>

  <script>
    // Hardcoded System Credentials
    const CREDENTIALS = {
      user: { username: "user", password: "user123" },
      admin: { username: "admin", password: "admin123" }
    };

    // State Variables
    let currentRole = 'user';
    let menuItems = [
      { id: 1, title: 'Classic Cheeseburger', desc: 'Angus beef, cheddar, special sauce', price: 12.99 },
      { id: 2, title: 'Margherita Pizza', desc: 'Fresh mozzarella, basil, tomato sauce', price: 14.50 },
      { id: 3, title: 'Crispy Chicken Wrap', desc: 'Spicy mayo, lettuce, pickles', price: 9.99 }
    ];
    let cart = [];
    let orders = [
      { id: 101, user: 'user', items: '1x Classic Cheeseburger', total: 12.99, status: 'Completed' }
    ];

    // Toggle selected tab in login view
    function setRole(role) {
      currentRole = role;
      document.getElementById('toggle-user').classList.toggle('active', role === 'user');
      document.getElementById('toggle-admin').classList.toggle('active', role === 'admin');
    }

    // Authenticate inputs
    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();

      const expected = CREDENTIALS[currentRole];

      if (u === expected.username && p === expected.password) {
        document.getElementById('screen-login').classList.add('hidden');
        if (currentRole === 'user') {
          document.getElementById('user-display-name').innerText = u;
          document.getElementById('screen-user').classList.remove('hidden');
          renderMenu();
        } else {
          document.getElementById('screen-admin').classList.remove('hidden');
          renderAdminOrders();
        }
      } else {
        showToast("Invalid Username or Password");
      }
    }

    function logout() {
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('screen-user').classList.add('hidden');
      document.getElementById('screen-admin').classList.add('hidden');
      document.getElementById('screen-login').classList.remove('hidden');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Render Storefront Menu
    function renderMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = menuItems.map(item => `
        <div class="menu-card">
          <div class="menu-info">
            <h4>${item.title}</h4>
            <p>${item.desc}</p>
            <div class="menu-price">$${item.price.toFixed(2)}</div>
          </div>
          <button class="add-to-cart" onclick="addToCart(${item.id})">Add</button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const item = menuItems.find(i => i.id === id);
      cart.push(item);
      updateCartUI();
      showToast(`Added ${item.title} to cart`);
    }

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.length;
      
      const cartContainer = document.getElementById('cart-items');
      if (cart.length === 0) {
        cartContainer.innerHTML = '<p style="color: var(--subtext); text-align: center;">Your cart is empty.</p>';
      } else {
        cartContainer.innerHTML = cart.map((item, index) => `
          <div class="cart-item">
            <div>
              <strong>${item.title}</strong>
              <div style="font-size: 12px; color: var(--subtext);">$${item.price.toFixed(2)}</div>
            </div>
            <button onclick="removeFromCart(${index})" style="background: none; border: none; color: var(--primary); cursor: pointer;">Remove</button>
          </div>
        `).join('');
      }

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function toggleCart(open) {
      document.getElementById('cart-modal').classList.toggle('open', open);
    }

    function placeOrder() {
      if (cart.length === 0) return showToast("Cart is empty!");
      
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      const orderSummary = cart.map(i => i.title).join(', ');

      orders.push({
        id: Math.floor(100 + Math.random() * 900),
        user: document.getElementById('username').value || 'User',
        items: orderSummary,
        total: total,
        status: 'Pending'
      });

      cart = [];
      updateCartUI();
      toggleCart(false);
      showToast("Order placed successfully!");
    }

    // Admin Functions
    function addMenuItem(e) {
      e.preventDefault();
      const title = document.getElementById('item-title').value;
      const desc = document.getElementById('item-desc').value;
      const price = parseFloat(document.getElementById('item-price').value);

      menuItems.push({ id: Date.now(), title, desc, price });
      
      document.getElementById('item-title').value = '';
      document.getElementById('item-desc').value = '';
      document.getElementById('item-price').value = '';

      showToast("Menu Item Added!");
    }

    function renderAdminOrders() {
      const container = document.getElementById('admin-orders-list');
      if (orders.length === 0) {
        container.innerHTML = '<p style="color: var(--subtext);">No orders placed yet.</p>';
        return;
      }

      container.innerHTML = orders.map(o => `
        <div class="order-item-admin">
          <div>
            <strong>Order #${o.id}</strong> (${o.user})
            <div style="font-size: 12px; color: var(--subtext);">${o.items}</div>
            <div style="font-weight: 700; color: var(--primary); margin-top: 4px;">$${o.total.toFixed(2)}</div>
          </div>
          <span class="status-badge ${o.status === 'Pending' ? 'status-pending' : 'status-completed'}">${o.status}</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
